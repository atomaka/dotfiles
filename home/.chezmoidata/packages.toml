# Each [[packages.tool]] entry is one logical tool. `name` is the default
# identifier used for every manager unless overridden by a per-manager field
# (brew/cask/pacman/aur). `managers` selects which package managers install
# it and defaults to ["brew", "pacman"] (the primary manager per OS) when
# omitted; "cask" and "aur" are opt-in only, never defaulted. `personal`
# gates on the .personal chezmoi data var. `repositories` declares any
# third-party source (e.g. a Homebrew tap) a manager needs registered
# before install — AUR needs none, paru resolves packages by name directly.
#
# Pacman/AUR package names have been verified against archlinux.org's
# package search JSON API and the AUR RPC API. Entries marked VERIFY are
# exceptions that couldn't be confirmed this way (e.g. a package that
# doesn't exist yet anywhere).

[[packages.tool]]
name = "ansible"

[[packages.tool]]
name = "aws-cli"
brew = "awscli"
pacman = "aws-cli" # confirmed: archlinux.org/packages extra/aws-cli

[[packages.tool]]
name = "base-devel"
managers = ["pacman"]
# build toolchain (makepkg, gcc, fakeroot, ...), required before
# run_once_15_install_paru can bootstrap paru

