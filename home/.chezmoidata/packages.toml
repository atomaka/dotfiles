[[packages.tool]]
name = "openssl"
brew = "openssl@3"
managers = ["brew"]
# darwin only: real OpenSSL via brew (system one is LibreSSL-based).
# native/system on linux, not tracked here for now.
# @3 still required: homebrew-core carries openssl@3 and openssl@4 as
# distinct, actively maintained formulae (not a deprecated pin) — @3 is kept
# since that's the ABI everything else here still links against.

[[packages.tool]]
name = "qmk"
managers = ["brew", "pacman"]
brew = "qmk/qmk/qmk"
personal = true
repositories = [
  { manager = "brew", name = "qmk/qmk", url = "https://github.com/qmk/homebrew-qmk.git", trusted = true },
  { manager = "brew", name = "osx-cross/arm", url = "https://github.com/osx-cross/homebrew-arm.git", trusted = true },
  { manager = "brew", name = "osx-cross/avr", url = "https://github.com/osx-cross/homebrew-avr.git", trusted = true },
]
# url is required even though these are the default GitHub tap locations:
# without it, Brewfile's `trusted: true` silently gets parsed into the
# clone_target slot and is dropped (Homebrew/brew#22668), leaving the tap
# untrusted. osx-cross/arm and osx-cross/avr aren't installed directly —
# they're transitive taps pulled in by qmk's arm-none-eabi-gcc@8 and
# avr-gcc@8 dependencies (per qmk.rb's depends_on lines, the only two
# cross-tap deps it has), and Homebrew's tap-trust model (6.0.0+) requires
# each to be explicitly trusted too, or the formula load is refused even
# though nothing here calls it by name.
# pacman: confirmed archlinux.org/packages extra/qmk (no tap/repository
# needed on linux, it's in the official repo directly)

